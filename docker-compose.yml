services:
  mediamtx:
    # wariant z ffmpeg: potrzebny do strumieni demo (runOnInit w server/mediamtx.yml)
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: ${PROJECT_NAME}-mediamtx
    # Wolumen nagran jest wspolny z live-panel (uid 1000): katalogi musza nalezec do 1000, zeby panel mogl
    # przenosic i kasowac pliki, ktore MediaMTX (root) tam zapisuje. API (:9997) nie ma portu na hoscie.
    entrypoint: ["sh", "-c", "mkdir -p /recordings/mtx/video/normal_cam /recordings/demo && chown -R 1000:1000 /recordings && exec /mediamtx /mediamtx.yml"]
    ports:
      - ${SRT_PORT}:8890/udp
      - ${WEBRTC_PORT}:8889
      # ICE 1:1 (UDP i TCP): MediaMTX oglasza klientom port, na ktorym nasluchuje
      - ${STREAM_PORT}:${STREAM_PORT}/udp
      - ${STREAM_PORT}:${STREAM_PORT}/tcp
      # RTMP od drona DJI (z internetu, z haslem); port trzeba tez otworzyc w firewallu serwera
      - ${RTMP_PORT:-1935}:1935
      # RTSP (diagnostyka, tylko TCP); nasluch wlacza RTSP_ENABLE=yes, bez tego polaczenia sa odrzucane
      - ${RTSP_PORT:-18554}:8554
    environment:
      - MTX_WEBRTCLOCALUDPADDRESS=:${STREAM_PORT}
      - MTX_WEBRTCLOCALTCPADDRESS=:${STREAM_PORT}
      # publiczny adres (IP lub nazwa) serwera dla kandydatow ICE; lista po przecinku
      - MTX_WEBRTCADDITIONALHOSTS=${WEBRTC_ADDITIONAL_HOSTS}
      # login i haslo nadawcy drona (wpis nr 2 w authInternalUsers w server/mediamtx.yml); oba wymagane
      # skad robot moze publikowac bez hasla (wpis nr 1): CIDR-y po przecinku, np. siec VPN; domyslnie tylko localhost
      - MTX_AUTHINTERNALUSERS_1_IPS=${ROBOT_PUBLISH_IPS:-127.0.0.1,::1}
      - MTX_AUTHINTERNALUSERS_2_USER=${DJI_PUBLISH_USER:?set DJI_PUBLISH_USER in .env}
      - MTX_AUTHINTERNALUSERS_2_PASS=${DJI_PUBLISH_PASS:?set DJI_PUBLISH_PASS in .env}
      # login do API MediaMTX dla panelu (wpis nr 5): przelaczanie nagrywania kamery robota
      - MTX_AUTHINTERNALUSERS_5_USER=panel
      - MTX_AUTHINTERNALUSERS_5_PASS=${MEDIAMTX_API_PASS:?set MEDIAMTX_API_PASS in .env}
      # wyjscie RTSP (yes/no)
      - MTX_RTSP=${RTSP_ENABLE:-no}
      # strumienie demo (video/*/demo): yes/no
      - DEMO_STREAMS=${DEMO_STREAMS:-yes}
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml
      - ./server/mediamtx-demo.sh:/demo.sh:ro
      - ./server/media:/media:ro
      - recordings:/recordings
    restart: always
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: ${PROJECT_NAME}-mqtt
    ports:
      - ${MQTT_PORT}:1883
    volumes:
      - ./server/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: always
  backend:
    build: ./backend
    container_name: ${PROJECT_NAME}-backend
    environment:
      - APP_ENV=${APP_ENV}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_V2_TOKEN}
      - INFLUXDB_ORG=KoNaR
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      # adres rosbridge robota (VPN); bez tego backend probuje localhost i /api/v1/ros/* zostaje na false
      - ROSBRIDGE_HOST=${ROSBRIDGE_HOST}
    depends_on:
      - influxdb
    restart: always
  gateway:
    build: ./gateway
    container_name: ${PROJECT_NAME}-gateway
    environment:
      - API_KEY=${GATEWAY_API_KEY}
      - ROSBRIDGE_HOST=${ROSBRIDGE_HOST:-10.13.13.2}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      # baza adresow WHEP w /streams; pusta = sciezki wzgledne (/video/<cam>/whep) na tym samym hoscie co API
      - MEDIAMTX_BASE=${MEDIAMTX_BASE:-}
      # publiczny adres API (https://host) do pola `servers` w /openapi.json; pusty = bez `servers`
      - PUBLIC_BASE_URL=${GATEWAY_PUBLIC_URL:-}
      - STREAMS_VPN_ONLY=${STREAMS_VPN_ONLY:-1}
      # robot demo: odtwarza w petli nagranie telemetrii wybrane w panelu (wskaznik w wolumenie nagran)
      - DEMO_ROBOT_ID=${DEMO_ROBOT_ID:-cerber-demo}
      - DEMO_TELEMETRY_POINTER=/recordings/demo/telemetry.path
    volumes:
      - recordings:/recordings:ro
    depends_on:
      - mosquitto
    restart: always
  live-panel:
    # Panel podgladu (read-only) pod / na publicznym hoscie. Haslo (basic_auth) i TLS daje Caddy; klucz API
    # zostaje w tym kontenerze. Telemetrie bierze z gatewaya, sygnalizacje WHEP z MediaMTX po sieci wewnetrznej,
    # media (ICE) ida jak dotad wprost z MediaMTX do przegladarki. Bez portow na hoscie: dostep tylko przez Caddy.
    build: ./live-panel
    container_name: ${PROJECT_NAME}-live-panel
    environment:
      - CERBER_API_KEY=${GATEWAY_API_KEY}
      - CERBER_API_ORIGIN=http://gateway:8000
      - CERBER_VIDEO_ORIGIN=http://mediamtx:8889
      - CERBER_ROBOT_ID=${PANEL_ROBOT_ID:-cerber-lite3-01}
      # nazwy hostow, pod ktorymi przegladarka otwiera panel (naglowek Host przekazany przez Caddy); po przecinku
      - CERBER_PANEL_HOSTS=${PANEL_HOSTS:-cerber.machinekind.ai}
      # jednoczesne karty/kamery (kazda karta = jedna sesja WHEP w MediaMTX)
      - CERBER_PANEL_MAX_VIEWERS=${PANEL_MAX_VIEWERS:-8}
      # nagrywanie: wideo przez API MediaMTX (record na video/normal_cam), telemetria z ramek gatewaya;
      # limity jednego nagrania i rotacja (najstarsze kasowane; nagranie demo nigdy)
      - CERBER_RECORDINGS_DIR=/recordings
      - CERBER_MEDIAMTX_API=http://mediamtx:9997
      - CERBER_MEDIAMTX_USER=panel
      - CERBER_MEDIAMTX_PASS=${MEDIAMTX_API_PASS:?set MEDIAMTX_API_PASS in .env}
      - CERBER_RECORD_MAX_SECONDS=${RECORD_MAX_SECONDS:-300}
      - CERBER_RECORD_MAX_BYTES=${RECORD_MAX_BYTES:-262144000}
      - CERBER_RECORD_KEEP=${RECORD_KEEP:-20}
      - CERBER_RECORD_TOTAL_BYTES=${RECORD_TOTAL_BYTES:-2147483648}
    volumes:
      - recordings:/recordings
    depends_on:
      - gateway
      - mediamtx
    restart: always
  frontend:
    # Dashboard teleoperacji; bundle budowany pod /teleop/ (base we vite.config.js), Caddy serwuje go z VPN.
    build: ./frontend
    container_name: ${PROJECT_NAME}-frontend
    volumes:
      - frontend-dist:/app/dist
    command: ["sh", "-c", "npm run build"]
    restart: no
  influxdb:
    image: influxdb:2
    container_name: ${PROJECT_NAME}-influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=KoNaR
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_V2_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./server/influxdb/config:/etc/influxdb2
    restart: always
volumes:
  frontend-dist:
    name: ${PROJECT_NAME}_frontend-dist
  # nagrania z panelu: <id>/video.mp4 + telemetry.ndjson + meta.json, mtx/ (robocze MediaMTX), demo/ (wskazniki)
  recordings:
    name: ${PROJECT_NAME}_recordings
  mosquitto-data: null
  mosquitto-log: null
  influxdb-data: null
  prometheus-data: null
  grafana-data: null
networks:
  default:
    name: ${INTERNAL_NETWORK_NAME:-cerber_internal}
    external: true

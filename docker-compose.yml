services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - SERVERURL=178.104.138.10
      - SERVERPORT=51820
      - PEERS=robot1,maxpc1,maxpc2,borsukpc1,cardaverpc1,zielinskpc1,antonpc1
    volumes:
      - ./server/wg-config:/config
    ports:
      - "51820:51820/udp" # WireGuard VPN port
      #- "80:80" # Nginx HTTP port
      #- "443:443" # Nginx HTTPS port
      #- "8890:8890/udp" # SRT port (Mediamtx)
      #- "8889:8889" # WebRTC port (Mediamtx)
      #- "8189:8189" # Video streaming port (Mediamtx)

    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    network_mode: "service:wireguard"
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml
    depends_on:
      - wireguard
    restart: always

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    volumes:
      - ./server/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./server/mosquitto/data:/mosquitto/data
      - ./server/mosquitto/log:/mosquitto/log
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-router
    network_mode: "service:wireguard"
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/:/usr/share/nginx/html:ro
      - ./server/certs:/etc/nginx/certs:ro
    depends_on:
      - mediamtx
      - mosquitto
      - backend
    restart: always

  backend:
    build: ./backend
    container_name: backend
    network_mode: "service:wireguard"
    depends_on:
      - wireguard
      - influxdb
    env_file:
      - .env
    restart: always

  influxdb:
    image: influxdb:2
    container_name: influxdb
    network_mode: "service:wireguard"
    volumes:
      - ./server/influxdb/data:/var/lib/influxdb2
      - ./server/influxdb/config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=KoNaR
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_V2_TOKEN}
    depends_on:
      - wireguard
    restart: always

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }


    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /dash/ {
            allow 10.13.13.0/24; # Allow the WireGuard internal IP range
            deny all;          # Block everyone else
            proxy_pass http://localhost:18083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /video/jetson_stream {
            allow 10.13.13.0/24;
            deny all;
            return 302 /video/jetson_stream;
        }
        location ^~ /video/ {
            allow 10.13.13.0/24;
            deny all;

            # strip /video prefix, keep rest of URI exactly
            # /video/jetson_stream      -> /jetson_stream
            # /video/jetson_stream/whep -> /jetson_stream/whep
            rewrite ^/video(/.*)$ $1 break;

            proxy_pass http://127.0.0.1:8889;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # important for long-poll / streaming style responses
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;

            proxy_redirect ~^(/.*)$ /video$1;
        }
    }
}

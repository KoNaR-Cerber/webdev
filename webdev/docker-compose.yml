services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - SERVERURL=127.0.0.1
      - SERVERPORT=51820
      - PEERS=robot1,maxpc1,cardaverpc1, zielinskpc1
    volumes:
      - ./server/wg-config:/config
    ports:
      - "51820:51820/udp" # WireGuard VPN port
      - "80:80" # Nginx HTTP port
      - "443:443" # Nginx HTTPS port
      #- "8890:8890/udp" # SRT port (Mediamtx)
      #- "8889:8889" # WebRTC port (Mediamtx)
      #- "8189:8189" # Video streaming port (Mediamtx)

    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    network_mode: "service:wireguard"
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml
    restart: always

  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    network_mode: "service:wireguard"
    environment:
      - "EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_USERNAME}"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_PASSWORD}"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-router
    network_mode: "service:wireguard"
    volumes:
      - ./server/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/:/usr/share/nginx/html:ro
      - ./server/certs:/etc/nginx/certs:ro
    restart: always
